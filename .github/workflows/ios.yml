name: iOS TrollStore Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 'any'

      - name: Install Dependencies
        run: flutter pub get

      - name: Install ldid (TrollStore Signing Tool)
        run: brew install ldid

      - name: Setup Share Extension Target
        run: |
          gem install xcodeproj
          ruby setup_extension.rb

      - name: Prepare Flutter Build
        run: |
          # Run flutter build to generate the Flutter framework and Dart AOT code
          # This may fail due to extension signing, but it prepares all Flutter assets
          flutter build ios --no-codesign || true

      - name: Build with xcodebuild (includes Share Extension)
        run: |
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -allowProvisioningUpdates=NO \
            | tail -50

      - name: Locate and Verify Build Products
        run: |
          echo "=== Looking for Runner.app ==="
          APP_PATH=$(find build/ios/derived -name "Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          
          echo "=== Checking for Share Extension ==="
          if [ -d "$APP_PATH/PlugIns/TwitterShareExtension.appex" ]; then
            echo "SUCCESS: Share Extension found inside Runner.app!"
            ls -la "$APP_PATH/PlugIns/"
          else
            echo "WARNING: Share Extension NOT found in PlugIns"
            echo "Listing PlugIns directory if it exists:"
            ls -la "$APP_PATH/PlugIns/" 2>/dev/null || echo "No PlugIns directory"
            
            echo "Searching for .appex files anywhere in build:"
            find build -name "*.appex" -type d 2>/dev/null || echo "No .appex found"
          fi
          
          # Export the path for later steps
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Inject TrollStore Privileges (ldid)
        run: |
          # Inject entitlements to main app binary
          ldid -Strollstore_entitlements.plist "$APP_PATH/Runner"
          echo "Injected entitlements to Runner"
          
          # Inject entitlements to Share Extension binary if it exists
          if [ -f "$APP_PATH/PlugIns/TwitterShareExtension.appex/TwitterShareExtension" ]; then
            ldid -Strollstore_entitlements.plist "$APP_PATH/PlugIns/TwitterShareExtension.appex/TwitterShareExtension"
            echo "Injected entitlements to TwitterShareExtension"
          fi

      - name: Create TrollStore IPA Payload
        run: |
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r twitter_downloader_trollstore.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trollstore-twitter-downloader
          path: twitter_downloader_trollstore.ipa
